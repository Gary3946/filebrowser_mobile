<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
<defs>  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141A3A"/><stop offset="0.55" stop-color="#3B1E8F"/><stop offset="1" stop-color="#6D28D9"/>
  </linearGradient>
  <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#67E8F9" stop-opacity="0.9"/><stop offset="0.4" stop-color="#22D3EE" stop-opacity="0.35"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.30"/><stop offset="1" stop-color="#818CF8" stop-opacity="0.12"/>
  </linearGradient>
  <linearGradient id="folderTab" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#C7D2FE" stop-opacity="0.40"/><stop offset="1" stop-color="#A5B4FC" stop-opacity="0.18"/>
  </linearGradient>
  <radialGradient id="nucleus" cx="0.5" cy="0.4" r="0.6">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#A5F3FC"/><stop offset="1" stop-color="#22D3EE"/>
  </radialGradient>
  <filter id="softBig" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="dot" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="3.2"/></filter>
</defs>
<g transform="translate(54,54) scale(0.19) translate(-256,-278)">
  <!-- core glow behind everything -->
  <circle cx="256" cy="278" r="180" fill="url(#coreGlow)"/>

  <!-- ORBITS behind the folder -->
  <g fill="none" stroke-linecap="round">
    <g transform="rotate(-24 256 278)"><ellipse cx="256" cy="278" rx="168" ry="60" stroke="#67E8F9" stroke-width="4" opacity="0.35"/></g>
    <g transform="rotate(38 256 278)"><ellipse cx="256" cy="278" rx="168" ry="60" stroke="#F472B6" stroke-width="4" opacity="0.30"/></g>
  </g>

  <!-- FOLDER (glass) -->
  <g>
    <path d="M132 236 a18 18 0 0 1 18 -18 h74 a14 14 0 0 1 11 6 l13 18 h94 a18 18 0 0 1 18 18 v112 a18 18 0 0 1 -18 18 H132 z"
          fill="#3730A3" fill-opacity="0.72" stroke="#C7D2FE" stroke-opacity="0.30" stroke-width="1.5"/>
    <path d="M150 218 h74 a14 14 0 0 1 11 6 l13 18 H135 v-6 a18 18 0 0 1 15 -18 z" fill="url(#folderTab)"/>
    <path d="M120 276 a18 18 0 0 1 18 -18 h236 a18 18 0 0 1 18 18 v82 a18 18 0 0 1 -18 18 H138 a18 18 0 0 1 -18 -18 z"
          fill="url(#folderFront)" stroke="#C7D2FE" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M140 260 h232" stroke="#E0E7FF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ORBITS in front -->
  <g fill="none" stroke-linecap="round">
    <g transform="rotate(-24 256 278)"><ellipse cx="256" cy="278" rx="168" ry="60" stroke="#67E8F9" stroke-width="4" opacity="0.85"/></g>
    <g transform="rotate(38 256 278)"><ellipse cx="256" cy="278" rx="168" ry="60" stroke="#F472B6" stroke-width="4" opacity="0.8"/></g>
    <g transform="rotate(90 256 278)"><ellipse cx="256" cy="278" rx="168" ry="56" stroke="#C4B5FD" stroke-width="3.5" opacity="0.7"/></g>
  </g>

  <!-- NUCLEUS -->
  <circle cx="256" cy="278" r="34" fill="#22D3EE" opacity="0.5" filter="url(#softBig)"/>
  <circle cx="256" cy="278" r="19" fill="url(#nucleus)"/>
  <circle cx="249" cy="271" r="6" fill="#FFFFFF" opacity="0.9"/>

  <!-- ELECTRONS -->
  <g transform="rotate(-24 256 278)"><circle cx="424" cy="278" r="12" fill="#67E8F9" filter="url(#dot)"/><circle cx="424" cy="278" r="7" fill="#ECFEFF"/></g>
  <g transform="rotate(38 256 278)"><circle cx="88" cy="278" r="12" fill="#F472B6" filter="url(#dot)"/><circle cx="88" cy="278" r="7" fill="#FCE7F3"/></g>
  <g transform="rotate(90 256 278)"><circle cx="256" cy="110" r="10" fill="#C4B5FD" filter="url(#dot)"/><circle cx="256" cy="110" r="5.5" fill="#F5F3FF"/></g>

</g>
</svg>